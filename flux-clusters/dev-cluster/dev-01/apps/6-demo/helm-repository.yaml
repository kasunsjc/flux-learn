apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: 6-demo-source-helm-bb-app
  namespace: flux-system
spec:
  interval: 5m0s
  url: https://sidd-harth.github.io/block-buster-helm-app

---

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: 6-demo-source-helm-bb-app
  namespace: flux-system
spec:
  interval: 1m
  releaseName: 6-demo-helm-bb-app
  targetNamespace: 6-demo
  install:
    createNamespace: true
  chart:
    spec:
      interval: 1m
      reconcileStrategy: Revision
      sourceRef:
        kind: HelmRepository
        name: 6-demo-source-helm-bb-app
        namespace: flux-system
  values:
    replicaCount: 1
    image:
      repository: siddharth67/block-buster-dev:7.6.0
      pullPolicy: Always
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    imagePullSecrets: []
    nameOverride: ""
    fullnameOverride: ""
    service:
      type: ClusterIP
      port: 80
      targetPort: 80
    namespace:
      name: demo-app  
    labels:
      app:
        name: bb-app
        version: 7.x.x
        env: uat