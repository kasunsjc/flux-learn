apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: 8-demo-image-repo
  namespace: flux-system
spec:
  image: acrfluxcdearn.azurecr.io/bb-app-flux-demo
  interval: 60s
  provider: azure

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: 8-demo-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: 8-demo-image-repo
  digestReflectionPolicy: IfNotPresent
  policy:
    semver:
      range: 7.x.x