apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: bb-app-oci
  namespace: flux-system
spec:
  interval: 5m
  url: oci://acrfluxcdearn.azurecr.io/helm/block-buster-helm-app
  ref:
    semver: "7.x"
  provider: azure
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bb-app-oci
  namespace: flux-system
spec:
  interval: 1m
  releaseName: bb-app-oci
  targetNamespace: 7-demo
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: bb-app-oci
    namespace: flux-system